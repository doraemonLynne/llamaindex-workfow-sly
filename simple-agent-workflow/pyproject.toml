[project]
name = "llama-index-server-examples"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "llama-index-server",
    "llama-index-llms-huggingface",
    "llama-index-embeddings-huggingface",
    "llama-index-llms-huggingface-api",
    "e2b-code-interpreter>=1.1.1,<2.0.0",
    "llama-cloud>=0.1.17,<1.0.0",
    "markdown>=3.7,<4.0",
    "xhtml2pdf>=0.2.17,<1.0.0",
    "transformers[torch]",
    "huggingface_hub[inference]",
    "llama-index"
]

[project.scripts]
generate = "src.generate:generate_index"

[tool.mypy]
python_version = "3.11"
plugins = "pydantic.mypy"
exclude = [ "tests", "venv", ".venv", "output", "config" ]
check_untyped_defs = true
warn_unused_ignores = false
show_error_codes = true
namespace_packages = true
ignore_missing_imports = true
follow_imports = "silent"
implicit_optional = true
strict_optional = false
disable_error_code = [ "return-value", "assignment" ]

[[tool.mypy.overrides]]
module = "src.*"
ignore_missing_imports = false

[tool.hatch]
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
[tool.hatch.build.targets]
[tool.hatch.build.targets.wheel]
packages = [ "src" ]

[build-system]
requires = [ "hatchling>=1.24" ]
build-backend = "hatchling.build"